# =============================
# Nginx конфигурация (PROD) для FleetManagementSystemApp
# Единственная внешняя точка входа (HTTP/80), без TLS на этой фазе
# - Проксирование / на приложение app:8080
# - Проксирование /seq на Seq:80 (базовая аутентификация basic-auth)
# - /healthz — эндпоинт здоровья самого Nginx (не зависит от приложения)
# =============================

# Количество рабочих процессов: auto — определяет по числу CPU
worker_processes auto;

# Модуль событий: количество одновременных соединений на процесс
events {
    worker_connections 1024;
}

http {
    # Базовые безопасные заголовки (минимум)
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";

    # Сжатие ответов (опционально)
    # gzip on;
    # gzip_types text/plain text/css application/json application/javascript application/octet-stream;

    # Апстримы — именованные группы бэкендов внутри Docker-сети
    upstream app_upstream {
        # Имя сервиса из docker-compose (app) и внутренний порт (8080)
        server app:8080;
        keepalive 32; # держать некоторое количество keepalive-соединений
    }

    upstream seq_upstream {
        # Имя сервиса Seq (seq) и порт по умолчанию (80)
        server seq:80;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _; # любой хостнейм

        # Healthcheck самого Nginx: не зависит от приложения
        # Используется контейнерным healthcheck'ом nginx
        location /healthz {
            # Возвращает 200 ОК без проксирования
            add_header Content-Type text/plain;
            return 200;
        }

        # Проксирование запросов на приложение
        location / {
            # Заголовки исходного клиента и схемы
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Рекомендуемые таймауты и буферы
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_buffers 8 16k;
            proxy_buffer_size 32k;

            proxy_pass http://app_upstream;
        }

        # Доступ к UI Seq по префиксу /seq
        # Прячем его за basic-auth (временно, до включения TLS)
        location /seq {
            # ВНИМАНИЕ: без TLS basic-auth уязвим к перехвату!
            # Использовать только как временную меру.
            auth_basic "Restricted Seq";
            # Файл паролей должен быть смонтирован в контейнер nginx (см. docker-compose)
            auth_basic_user_file /etc/nginx/auth/htpasswd;

            # Прокси на Seq
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://seq_upstream;
        }

        # Пример редиректа на HTTPS (отключен сейчас)
        # return 301 https://$host$request_uri;
    }

    # =============================
    # Пример конфигурации TLS (закомментировано)
    # Чтобы включить:
    # 1) Сгенерируйте/получите сертификаты (fullchain.pem, privkey.pem)
    # 2) Смонтируйте их в контейнер nginx: /etc/nginx/certs
    # 3) Раскомментируйте блок ниже и при необходимости настройте HSTS/редирект
    # =============================

    # server {
    #     listen 443 ssl;
    #     server_name example.com; # замените на ваш домен

    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;

    #     # Рекомендуемые SSL-настройки (минимальный шаблон)
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;

    #     # HSTS (опционально): включает строгую политику HTTPS
