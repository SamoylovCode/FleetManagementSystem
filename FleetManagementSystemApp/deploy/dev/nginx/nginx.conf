# =============================
# Nginx конфигурация (DEV) для FleetManagementSystemApp
# Единственная внешняя точка входа (HTTP/80), без TLS
# - Проксирование / на приложение app:8080
# - Проксирование /seq на Seq:80 (базовая аутентификация basic-auth)
# - /healthz — эндпоинт здоровья самого Nginx (не зависит от приложения)
# =============================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";

    upstream app_upstream {
        server app:8080;
        keepalive 32;
    }

    upstream seq_upstream {
        server seq:80;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        location /healthz {
            add_header Content-Type text/plain;
            return 200;
        }

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_buffers 8 16k;
            proxy_buffer_size 32k;

            proxy_pass http://app_upstream;
        }

        location = /seq {
            return 301 /seq/;
        }

        location /seq/ {
            auth_basic "Restricted Seq";
            auth_basic_user_file /etc/nginx/auth/htpasswd;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /seq;
            proxy_pass http://seq_upstream/;
        }
    }

    # Пример TLS-конфига
    # server {
    #     listen 443 ssl;
    #     server_name example.com;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     # HSTS (опционально):
    #     # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     location /healthz { return 200; }
