# ==============================================
# GitHub Actions: Multi-Arch Docker Build & Push
# Собирает и публикует образы для linux/amd64 и linux/arm64
# Теги: :latest и :{sha}
# Требуются Secrets и Variables (см. ниже)
# ==============================================

name: Build & Push Multi-Arch

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Эмуляция архитектуры arm64 для сборки на x86 runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Подготовка buildx builder для multi-arch
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Логин в реестр образов
      # Требуются Secrets:
      #   - REGISTRY           (пример: ghcr.io)
      #   - REGISTRY_USER      (пример: ваш логин или BOT)
      #   - REGISTRY_PASSWORD  (пример: PAT-токен с правами на push)
      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Сборка и публикация multi-arch образов
      # Требуется Variable:
      #   - IMAGE_NAME (пример: your-org/fleetmanagementsystemapp)
      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.REGISTRY }}/${{ vars.IMAGE_NAME }}:latest
            ${{ secrets.REGISTRY }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ==============================================
# Инструкции по настройке Secrets и Variables
# ==============================================
# Secrets (Settings → Secrets and variables → Actions → New repository secret):
#   - REGISTRY:            адрес реестра (например, ghcr.io)
#   - REGISTRY_USER:       пользователь (логин/PAT-бот)
#   - REGISTRY_PASSWORD:   пароль/токен (PAT), с правами на write:packages
# Variables (Settings → Secrets and variables → Actions → Variables):
#   - IMAGE_NAME:          имя образа (например, your-org/fleetmanagementsystemapp)
# После сохранения, запушьте изменения в ветку main или запустите workflow вручную (workflow_dispatch).
